[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codecontext-graph"
version = "0.1.0"
description = "Agentic codebase & incident memory graph powered by Relate (Neo4j)"
requires-python = ">=3.11"
dependencies = ["relate-db>=1.0.1", "fastapi>=0.115.0", "uvicorn>=0.30.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
